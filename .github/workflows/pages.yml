name: Publish Crawld
on:
  push:
    branches: [main]
    paths: ['crawld-alpha-21.zip', '.github/workflows/pages.yml']
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6
      - name: Unpack the verified game
        run: |
          unzip -q crawld-alpha-21.zip
          mv crawld dist
          printf 'crawler.leolune.fun\n' > dist/CNAME
          touch dist/.nojekyll
          test -f dist/index.html
      - name: Test game rules
        working-directory: dist
        run: node --test tests/*.test.js
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
